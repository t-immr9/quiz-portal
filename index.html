<!doctype html>
<!-- リポジトリ: quiz-portal / 数学演習室(生徒用ポータル) -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学演習室</title>
<meta name="theme-color" content="#F3F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--grid:rgba(41,77,130,.07);--ink:#14284A;--sub:#5A6B85;--card:#FFFFFF;--line:#DCE4EF;--accent:#FF6B2C;--accent-soft:#FFE6DA;--ok:#13A07A;--ok-soft:#D7F2E9;--shadow:0 1px 0 rgba(20,40,74,.06),0 6px 18px -10px rgba(20,40,74,.25);
--head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;--body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1F38;--grid:rgba(140,178,224,.08);--ink:#E8EEF7;--sub:#9FB0C8;--card:#172C4D;--line:#24406A;--accent-soft:#4A2A1C;--ok-soft:#123D35;--shadow:0 6px 18px -10px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,var(--bg);color:var(--ink);font:400 16px/1.7 var(--body);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* 上のバー */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font:900 1.15rem/1 var(--head);letter-spacing:.04em;white-space:nowrap}
.mark{width:28px;height:28px}
.mark circle{fill:none;stroke:var(--ink);stroke-width:2.2}
.mark .hand{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;transform-origin:16px 16px;animation:turn 60s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;min-width:198px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 0;font:700 .9rem/1 var(--head);border-radius:999px;cursor:pointer;color:var(--sub);transition:color .25s}
.seg button[aria-pressed="true"]{color:#fff}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:999px;background:var(--accent);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0}
.seg[data-g] .seg-ind{opacity:1}

/* 画面の切り替え */
#app{transition:opacity .22s,transform .22s}
#app.leaving{opacity:0;transform:translateY(6px)}

/* はじめての画面 */
.choose{padding:48px 0 24px;text-align:center}
.choose h1{font:900 clamp(1.6rem,6vw,2.2rem)/1.3 var(--head);margin:0 0 6px}
.choose p{color:var(--sub);margin:0 0 26px}
.choose-list{display:grid;gap:12px;max-width:420px;margin:0 auto}
.choose-list button{display:flex;align-items:center;gap:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.choose-list button:active{transform:scale(.98)}
.choose-list b{font:900 1.6rem/1 var(--head);color:var(--accent);min-width:2.4em}
.choose-list span{display:block;font-weight:700}
.choose-list small{display:block;color:var(--sub);font-size:.85rem;font-weight:400}

/* 今日の3分(このページのいちばん大事な場所) */
.today{margin:20px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.dial{position:relative;width:118px;height:118px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .bg{fill:none;stroke:var(--line);stroke-width:10}
.dial .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.today.done .dial .fg{stroke:var(--ok)}
.dial-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial-c b{font:900 2.3rem/1 var(--head)}
.dial-c small{font-size:.75rem;color:var(--sub)}
.today-date{font:700 .9rem/1.4 var(--head);color:var(--sub);margin:0}
.today-status{font:900 1.35rem/1.35 var(--head);margin:2px 0 4px}
.today.plain .today-sub{margin-bottom:12px}
.today-sub{font-size:.88rem;color:var(--sub);margin:0}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font:700 1rem/1 var(--head);padding:14px 20px;border-radius:14px;box-shadow:0 8px 18px -10px var(--accent);transition:transform .12s,filter .2s}
.go:active{transform:scale(.97)}
.today.done .go{background:var(--ok);box-shadow:0 8px 18px -10px var(--ok)}
.today.plain{grid-template-columns:1fr}
.today>.go{grid-column:1/-1;width:100%}

/* さがす */
.search{position:relative;margin:16px 0 4px}
.search input{width:100%;font:500 1rem/1.4 var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 13px 42px;appearance:none}
.search input::placeholder{color:var(--sub)}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--sub);fill:none;stroke-width:2.2}

/* セクションへのジャンプ */
.chips{position:sticky;top:calc(53px + env(safe-area-inset-top));z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;background:linear-gradient(var(--bg) 70%,transparent);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:700 .85rem/1 var(--head);cursor:pointer;color:var(--sub);transition:background .2s,color .2s,border-color .2s}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 一覧 */
section.blk{scroll-margin-top:calc(110px + env(safe-area-inset-top));margin:18px 0 26px}
.blk h2{font:900 1.2rem/1.3 var(--head);margin:0 0 4px}
.blk .note{color:var(--sub);font-size:.85rem;margin:0 0 10px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:720px){.rows{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;min-height:62px;transition:transform .12s,border-color .2s}
.row:active{transform:scale(.985)}
@media (hover:hover){.row:hover{border-color:var(--accent)}}
.num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:900 1.05rem/1 var(--head);background:var(--accent-soft);color:var(--accent)}
.num.k{font-size:.78rem;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.row .t{font-weight:700;line-height:1.4}
.row .m{display:block;font-size:.78rem;color:var(--sub);font-weight:400}
.new{font:700 .72rem/1 var(--head);color:#fff;background:var(--accent);padding:5px 8px;border-radius:999px;position:relative}
.new::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 var(--accent);animation:ping 1.6s ease-out 2}
@keyframes ping{to{box-shadow:0 0 0 8px transparent}}
.chev{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2.2}

/* これまでの小テスト(開閉) */
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:700}
.acc-btn .chev{transition:transform .3s}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.acc.open{grid-template-rows:1fr}
.acc>div{overflow:hidden}
.acc .rows{padding-top:10px}

/* おまけ・コラム(横にスクロール) */
.shelf{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.tile{flex:none;width:min(68vw,240px);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .m{font-size:.75rem;color:var(--accent);font-weight:700}
.tile .t{font:700 .98rem/1.45 var(--head)}
.tile .d{font-size:.8rem;color:var(--sub);line-height:1.6}
.shelf-label{font:700 .85rem/1 var(--head);color:var(--sub);margin:14px 0 8px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--sub);text-align:center}
.count{color:var(--sub);font-size:.85rem;margin:6px 0 10px}
.foot{max-width:760px;margin:0 auto;padding:10px 16px 40px;color:var(--sub);font-size:.8rem}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><line class="hand" x1="16" y1="16" x2="16" y2="7"/></svg>数学演習室</a>
    <div class="seg" role="group" aria-label="学年"><span class="seg-ind"></span><button type="button" data-grade="1" aria-pressed="false">1年</button><button type="button" data-grade="2" aria-pressed="false">2年</button><button type="button" data-grade="3" aria-pressed="false">3年</button></div>
  </div>
</header>
<main id="app" class="wrap"></main>
<p class="foot">リンクが開かないときは、先生に知らせてください。新しい小テストやアプリは、このページに追加していきます。</p>

<script>
/* =====================================================================

   k    : 種類 daily=毎日3分数学 kousa=考査対策 test=小テスト extra=おまけ column=コラム

  {"g": 1, "k": "kousa", "tag": "考査対策", "name": "2学期中間対策", "href": "https://t-immr9.github.io/kousa-taisaku/suu1/math1_2gakki_chukan_taisaku.html"},

  {"g": 1, "k": "test", "n": "06", "old": true, "tag": "小テスト", "name": "2次関数の最大・最小（1）", "href": "https://t-immr9.github.io/suu1-2gakki-syoutest/06_2jikansuunosaidaisaisyou%281%29.html"},

  {"g": 2, "k": "kousa", "tag": "考査対策", "name": "1学期中間対策", "href": "https://t-immr9.github.io/kousa-taisaku/suu2/00_1gakki_chuukan.html"},
  {"g": 2, "k": "kousa", "tag": "考査対策", "name": "1学期中間対策 II", "href": "https://t-immr9.github.io/kousa-taisaku/suu2/01_1gakki_chuukan2.html"},

  {"g": 2, "k": "test", "n": "01", "old": true, "tag": "小テスト", "name": "円と直線（1）", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/01_entotyokusen1.html"},
  {"g": 2, "k": "test", "n": "02", "old": true, "tag": "小テスト", "name": "円と直線（2）", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/02_entotyokusen2.html"},
  {"g": 2, "k": "test", "n": "03", "old": true, "tag": "小テスト", "name": "軌跡", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/03_kiseki.html"},
  {"g": 2, "k": "test", "n": "04", "old": true, "tag": "小テスト", "name": "不等式の表す領域", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/04_huutousikinoarawasuryouiki.html"},
  {"g": 2, "k": "test", "n": "05", "old": true, "tag": "小テスト", "name": "連立不等式と領域", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/05_renritsuhuutousikitoryouiki.html"},
  {"g": 2, "k": "test", "n": "06", "old": true, "tag": "小テスト", "name": "一般角", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/06_ippankaku.html"},
  {"g": 2, "k": "test", "n": "07", "old": true, "tag": "小テスト", "name": "弧度法", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/07_kodohou.html"},
  {"g": 2, "k": "test", "n": "08", "old": true, "tag": "小テスト", "name": "三角関数（1）", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/08_sankakukansuu1.html"},
  {"g": 2, "k": "test", "n": "09", "old": true, "tag": "小テスト", "name": "三角関数（2）", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/09_sankakukansuu2.html"},
  {"g": 2, "k": "test", "n": "10", "old": true, "tag": "小テスト", "name": "三角関数の性質", "href": "https://t-immr9.github.io/suu2-2gakki-syoutest/10_sankakukansuunoseisitu.html"},

  {"g": 3, "k": "kousa", "tag": "考査対策", "name": "1学期期末対策", "href": "https://t-immr9.github.io/kousa-taisaku/suuA/01_1gakki_kimatsu_main.html"},
  {"g": 3, "k": "kousa", "tag": "考査対策", "name": "1学期期末対策 II", "href": "https://t-immr9.github.io/kousa-taisaku/suuA/02_1gakki_kimatsu_random.html"},
  {"g": 3, "k": "kousa", "tag": "考査対策", "name": "2学期中間対策", "href": "https://t-immr9.github.io/kousa-taisaku/suuA/suuA_2gakki_chukan_taisaku.html"},
  {"g": 3, "k": "kousa", "tag": "SPI・確率", "name": "SPI対策15 確率", "href": "https://t-immr9.github.io/spi_15_kakuritu/"},

  {"g": 3, "k": "test", "n": "05", "old": true, "tag": "小テスト", "name": "円に内接する四角形，円と接線", "href": "https://t-immr9.github.io/suuA-2gakki-syoutest/05_naisetsu.html"},

  {"g": 3, "k": "test", "n": "08", "tag": "小テスト", "name": "作図", "href": "https://t-immr9.github.io/suuA-2gakki-syoutest/08_sakuzu.html"},

  {"g": 0, "k": "extra", "tag": "計算練習", "name": "因数分解ドリル", "href": "https://t-immr9.github.io/drill-app/factorization_drill.html"},
  {"g": 0, "k": "extra", "tag": "計算練習", "name": "平方完成トレーニング", "desc": "手書きメモ付き・基本＆係数ありの2次関数変形ドリル", "href": "https://t-immr9.github.io/drill-app/heihoukansei_drill.html"},

  {"g": 0, "k": "column", "group": "整数のふしぎ", "tag": "整数のふしぎ・第2回", "name": "どんな数もブラックホールへ！ 3桁の「495」", "desc": "数字を大きい順と小さい順に並べて引くと、多くの3桁の数が495へ集まる。", "href": "columns/seisu-02.html"},
  {"g": 0, "k": "column", "group": "整数のふしぎ", "tag": "整数のふしぎ・第3回", "name": "最後は必ず1になる!? 終わらない謎「コラッツ予想」", "desc": "偶数なら2で割り、奇数なら3倍して1を足す。簡単なルールの先にある未解決問題を体験する。", "href": "columns/seisu-03.html"},
  {"g": 0, "k": "column", "group": "整数のふしぎ", "tag": "整数のふしぎ・第4回", "name": "358年の難問をAIが11日で解いた!? フェルマーの最終定理と「証明」の真相", "desc": "具体例による確認と数学的証明の違いを、フェルマーの最終定理とAIによる形式化のニュースから考える。", "href": "columns/seisu-04.html"},
  {"g": 0, "k": "column", "group": "数学と社会", "tag": "数学と社会・第1回", "name": "数学のテストで電卓を使ってよい時代が来る？", "desc": "電卓や数学アプリを活用する数学教育の提案から、これからの「数学ができる」を考える。", "href": "columns/society-01.html"},
  {"g": 0, "k": "column", "group": "授業のその先", "tag": "授業のその先・第1回", "name": "コンセントの電気は「sin のグラフ」だった", "desc": "家庭の電気は sin の波。100Vの正体や、東日本50Hz・西日本60Hzの違いを三角関数で読み解く。", "href": "columns/sonosaki-01.html"},
];
/* 学年ごとの設定。term は今学期の小テストの範囲、store は毎日3分数学の記録の保存名(連続日数の表示に使う) */
const GRADES = {
  1: { label: '1年', subject: '数学I',  term: '2学期「2次関数・データの分析」',             store: 'daily-math1-progress' },
  2: { label: '2年', subject: '数学II', term: '2学期「図形と方程式・三角関数・指数関数」', store: 'daily-math-v2-progress' },
  3: { label: '3年', subject: '数学A',  term: '2学期「図形の性質」',                       store: 'daily-mathA-progress' }
};

(function(){
  const KEY = 'quiz-portal-grade', app = document.getElementById('app');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tgt = h => /^https?:/.test(h) ? ' target="_blank" rel="noopener noreferrer"' : '';
  const num = a => parseInt(a.n, 10) || 0;
  const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const pad = n => String(n).padStart(2, '0');
  const ymd = o => { const d = new Date(Date.now() + o * 864e5); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  // 毎日3分数学の記録を読むだけ(書き換えない)
  function streak(store){
    try {
      const P = JSON.parse(localStorage.getItem(store) || '{}'), days = Object.keys(P.days || {}).filter(k => P.days[k] && P.days[k].completed).sort();
      let run = 0; days.forEach((d, i) => { run = i && (new Date(d) - new Date(days[i - 1])) / 864e5 === 1 ? run + 1 : 1; });
      const last = days[days.length - 1];
      return { done: last === ymd(0), run: (last === ymd(0) || last === ymd(-1)) ? run : 0 };
    } catch (e) { return { done: false, run: 0 }; }
  }

  function row(a, badge){
    const left = a.k === 'test' ? '<span class="num">' + esc(a.n) + '</span>' : '<span class="num k">' + (a.k === 'kousa' ? '対策' : a.k === 'daily' ? '毎日' : a.k === 'column' ? '読む' : '練習') + '</span>';
    return '<li><a class="row" href="' + esc(a.href) + '"' + tgt(a.href) + '>' + left +
      '<span class="t">' + esc(a.name) + '<span class="m">' + esc(a.tag || '') + (a.desc ? ' ・ ' + esc(a.desc) : '') + '</span></span>' +
      (badge ? '<span class="new">' + badge + '</span>' : chev) + '</a></li>';
  }
  const tile = a => '<a class="tile" href="' + esc(a.href) + '"' + tgt(a.href) + '><span class="m">' + esc(a.tag || a.group || '') + '</span><span class="t">' + esc(a.name) + '</span>' + (a.desc ? '<span class="d">' + esc(a.desc) + '</span>' : '') + '</a>';

  function today(g, mine){
    const G = GRADES[g], daily = mine.find(a => a.k === 'daily');
    const d = new Date(), wd = '日月火水木金土'[d.getDay()], date = (d.getMonth() + 1) + '月' + d.getDate() + '日(' + wd + ')';
    if (!daily) {
      const latest = mine.filter(a => a.k === 'test' && !a.old).sort((p, q) => num(q) - num(p))[0];
      if (!latest) return '';
      return '<section class="today plain"><div><p class="today-date">' + date + '</p><p class="today-status">いちばん新しい小テスト</p><p class="today-sub">' + esc(latest.n) + '　' + esc(latest.name) + '</p>' +
        '<a class="go" href="' + esc(latest.href) + '"' + tgt(latest.href) + '>小テストをひらく</a></div></section>';
    }
    const s = streak(G.store), cyc = s.run === 0 ? 0 : (s.run % 7 || 7), left = 7 - cyc;
    const status = s.done ? '今日はクリア済み' : '今日はまだです';
    const sub = s.done ? (left === 0 ? '1週間連続、達成。また明日。' : 'また明日。あと' + left + '日で1週間連続。')
                       : (s.run ? '今日も解けば ' + (s.run + 1) + '日連続。' : '1日5問、3分で終わります。');
    return '<section class="today' + (s.done ? ' done' : '') + '" data-cyc="' + cyc + '" data-run="' + s.run + '">' +
      '<div class="dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="50"/><circle class="fg" cx="60" cy="60" r="50"/></svg>' +
      '<div class="dial-c"><b>0</b><small>日連続</small></div></div>' +
      '<div><p class="today-date">' + date + '</p><p class="today-status">' + status + '</p><p class="today-sub">' + sub + '</p></div>' +
      '<a class="go" href="' + esc(daily.href) + '"' + tgt(daily.href) + '>' + (s.done ? 'もう1回ひらく' : '毎日3分数学をひらく') + '</a></section>';
  }

  function animateDial(){
    const t = app.querySelector('.today[data-cyc]'); if (!t) return;
    const fg = t.querySelector('.fg'), C = 2 * Math.PI * 50, cyc = +t.dataset.cyc, run = +t.dataset.run, b = t.querySelector('.dial-c b');
    fg.style.strokeDasharray = C; fg.style.strokeDashoffset = C;
    const target = C * (1 - cyc / 7);
    if (reduce) { fg.style.strokeDashoffset = target; b.textContent = run; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => { fg.style.strokeDashoffset = target; }));
    const t0 = performance.now(), dur = 900;
    (function step(now){ const p = Math.min(1, (now - t0) / dur); b.textContent = Math.round(run * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
  }

  function lists(g){
    const mine = APPS.filter(a => a.g === +g), common = APPS.filter(a => a.g === 0);
    const now = mine.filter(a => a.k === 'test' && !a.old).sort((p, q) => num(q) - num(p));
    const past = mine.filter(a => a.k === 'test' && a.old).sort((p, q) => num(p) - num(q));
    const kousa = mine.filter(a => a.k === 'kousa').reverse();
    return { mine, common, now, past, kousa, extra: common.filter(a => a.k === 'extra'), cols: common.filter(a => a.k === 'column') };
  }

  function render(g){
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.grade === String(g)));
    const seg = document.querySelector('.seg');
    if (GRADES[g]) { seg.dataset.g = g; seg.querySelector('.seg-ind').style.transform = 'translateX(' + (g - 1) * 100 + '%)'; } else delete seg.dataset.g;
    if (!GRADES[g]) {
      app.innerHTML = '<div class="choose"><h1>数学演習室</h1><p>自分の学年を選んでください。次からは選んだ学年がすぐ開きます。</p><div class="choose-list">' +
        Object.keys(GRADES).map(k => '<button type="button" data-grade="' + k + '"><b>' + GRADES[k].label + '</b><span>' + GRADES[k].subject + '<small>' + esc(GRADES[k].term) + '</small></span></button>').join('') + '</div></div>';
      app.querySelectorAll('.choose-list button').forEach(b => b.addEventListener('click', () => choose(b.dataset.grade)));
      return;
    }
    const L = lists(g), G = GRADES[g];
    const blocks = [];
    blocks.push(['now', '今の単元', '<p class="note">' + esc(G.term) + '。新しい順。</p>' + (L.now.length ? '<ul class="rows">' + L.now.map((a, i) => row(a, i === 0 ? '最新' : '')).join('') + '</ul>' : '<div class="empty">今学期の小テストは、まだありません。</div>')]);
    if (L.kousa.length) blocks.push(['exam', 'テスト対策', '<p class="note">考査対策アプリ。新しい順。</p><ul class="rows">' + L.kousa.map(a => row(a)).join('') + '</ul>']);
    if (L.past.length) blocks.push(['past', 'これまで', '<button type="button" class="acc-btn" aria-expanded="false">過去の小テスト ' + esc(L.past[0].n) + '〜' + esc(L.past[L.past.length - 1].n) + '(' + L.past.length + '個)' + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="acc"><div><ul class="rows">' + L.past.map(a => row(a)).join('') + '</ul></div></div>']);
    if (L.extra.length || L.cols.length) blocks.push(['more', 'おまけ・コラム', '<p class="note">授業の範囲とは別の、トレーニングと読みもの。横にスクロールできます。</p>' +
      (L.extra.length ? '<div class="shelf">' + L.extra.map(tile).join('') + '</div>' : '') +
      [...new Set(L.cols.map(a => a.group))].map(gr => '<p class="shelf-label">' + esc(gr) + '</p><div class="shelf">' + L.cols.filter(a => a.group === gr).map(tile).join('') + '</div>').join('')]);
    app.innerHTML = today(g, L.mine) +
      '<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/></svg><input type="search" id="q" placeholder="さがす(例:不等式、期末)" aria-label="小テストやアプリをさがす"></div>' +
      '<nav class="chips" aria-label="ページ内の移動">' + blocks.map(b => '<button type="button" data-to="' + b[0] + '">' + b[1] + '</button>').join('') + '</nav>' +
      '<div id="lists">' + blocks.map(b => '<section class="blk" id="' + b[0] + '"><h2>' + b[1] + '</h2>' + b[2] + '</section>').join('') + '</div><div id="found" hidden></div>';
    animateDial(); wire(g, L);
  }

  function wire(g, L){
    const acc = app.querySelector('.acc-btn');
    if (acc) acc.addEventListener('click', () => { const o = acc.getAttribute('aria-expanded') !== 'true'; acc.setAttribute('aria-expanded', o); acc.nextElementSibling.classList.toggle('open', o); });
    const chips = [...app.querySelectorAll('.chips button')];
    chips.forEach(c => c.addEventListener('click', () => document.getElementById(c.dataset.to).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' })));
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) chips.forEach(c => c.classList.toggle('on', c.dataset.to === e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
      app.querySelectorAll('section.blk').forEach(s => io.observe(s));
    }
    const chipsNav = app.querySelector('.chips'), q = app.querySelector('#q'), lists = app.querySelector('#lists'), found = app.querySelector('#found'), pool = [...L.mine.filter(a => a.k !== 'daily'), ...L.common];
    q.addEventListener('input', () => {
      const w = q.value.trim().toLowerCase();
      if (!w) { found.hidden = true; lists.hidden = false; chipsNav.hidden = false; return; }
      const hit = pool.filter(a => [a.name, a.tag, a.desc, a.group, a.n].join(' ').toLowerCase().includes(w));
      lists.hidden = true; found.hidden = false; chipsNav.hidden = true;
      found.innerHTML = '<p class="count">「' + esc(q.value.trim()) + '」 ' + hit.length + '件</p>' + (hit.length ? '<ul class="rows">' + hit.map(a => row(a)).join('') + '</ul>' : '<div class="empty">見つかりませんでした。ほかの言葉でさがしてみてください。</div>');
    });
  }

  function choose(g){
    try { localStorage.setItem(KEY, g); } catch (e) {}
    if (location.hash !== '#g' + g) history.replaceState(null, '', '#g' + g);
    if (reduce || !app.firstChild) { render(g); return; }
    app.classList.add('leaving');
    setTimeout(() => { render(g); window.scrollTo(0, 0); app.classList.remove('leaving'); }, 200);
  }
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => choose(b.dataset.grade)));
  window.addEventListener('hashchange', () => { const m = location.hash.match(/^#g([123])$/); if (m) choose(m[1]); });
  let g = (location.hash.match(/^#g([123])$/) || [])[1];
  if (!g) { try { g = localStorage.getItem(KEY); } catch (e) {} }
  render(g);
})();
</script>
